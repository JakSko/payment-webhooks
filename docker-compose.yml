name: payment-webhooks

# Local development values only. Production secrets come from the deployment environment.
x-app-env: &app-env
  DB_DSN: "pgsql:host=db;port=5432;dbname=payments"
  DB_USER: app
  DB_PASSWORD: local-dev-only
  WEBHOOK_SECRET: local-dev-only-webhook-secret

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment: *app-env
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
