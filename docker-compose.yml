name: payment-webhooks

# Local development values only. Production secrets come from the deployment environment.
x-app-env: &app-env
  DB_DSN: "pgsql:host=db;port=5432;dbname=payments"
  DB_USER: app
  DB_PASSWORD: local-dev-only
  WEBHOOK_SECRET: local-dev-only-webhook-secret
  NOTIFIER_URL: "http://notifier-mock:8081/notify"
  RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-6}
  RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
  RETRY_CAP_SECONDS: ${RETRY_CAP_SECONDS:-300}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: the temporary initdb server listens on the socket only, so the check
      # passes only after schema.sql is loaded and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment: *app-env
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["php", "bin/worker.php"]
    environment: *app-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      notifier-mock:
        condition: service_started

  notifier-mock:
    build: .
    command: ["php", "-S", "0.0.0.0:8081", "mock/notifier.php"]
    ports:
      - "${MOCK_PORT:-8081}:8081"

volumes:
  db-data:
